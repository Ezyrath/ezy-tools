---
repos:
  # MegaLinter has no Nix support, so Nix files are checked here directly
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra (format nix)
        entry: nix run nixpkgs#alejandra --
        language: system
        types: [nix]
        stages: [pre-commit]

      - id: deadnix
        name: deadnix (dead nix code)
        entry: nix run nixpkgs#deadnix -- --fail
        language: system
        types: [nix]
        stages: [pre-commit]

      - id: statix
        name: statix (nix lints)
        entry: nix run nixpkgs#statix -- check .
        language: system
        files: \.nix$
        pass_filenames: false
        stages: [pre-commit]

      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        files: (\.nix|flake\.lock)$
        pass_filenames: false
        stages: [pre-commit]

      - id: ezy-dev-test
        name: ezy_dev (url resolution & error safety)
        entry: >-
          bash -e -c '
          source ./bin/ezy_dev;
          url="$(antigravity2_get_latest_url)";
          [[ "$url" =~ /antigravity-hub/[0-9][0-9A-Za-z._-]+/linux-x64/Antigravity\.tar\.gz$ ]];
          curl -fsSI "$url" >/dev/null;
          tmp_home="$(mktemp -d)";
          mkdir -p "${tmp_home}/.local/share/antigravity2";
          touch "${tmp_home}/.local/share/antigravity2/sentinel";
          ! HOME="$tmp_home" ANTIGRAVITY2_URL="invalid://bad.tar.gz" antigravity2_install;
          [ -f "${tmp_home}/.local/share/antigravity2/sentinel" ];
          rm -rf "$tmp_home"
          '
        language: system
        files: ^bin/ezy_dev$
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/oxsecurity/megalinter
    rev: v10.1.0
    hooks:
      - id: megalinter-incremental
        stages: [pre-commit]
      - id: megalinter-full
        stages: [manual]
