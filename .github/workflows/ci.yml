name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    name: Flake Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check Nix code formatting (Alejandra)
        run: nix run nixpkgs#alejandra -- --check .

      - name: Lint Nix code (Statix)
        run: nix run nixpkgs#statix -- check .

      - name: Check for dead Nix code (Deadnix)
        run: nix run nixpkgs#deadnix -- --fail .

      - name: Run nix flake check
        run: nix flake check

      - name: Build default package
        run: nix build .#default --no-link

      - name: Verify devShells evaluation
        run: |
          nix develop .#empty --command echo "empty shell OK"
          nix develop .#jetbrains --command echo "jetbrains shell OK"

      - name: Test ezy_dev Antigravity 2 URL resolution and error safety
        run: |
          source ./bin/ezy_dev
          url="$(antigravity2_get_latest_url)"
          echo "Resolved Antigravity 2 URL: ${url}"
          if [[ ! "$url" =~ /antigravity-hub/[0-9][0-9A-Za-z._-]+/linux-x64/Antigravity\.tar\.gz$ ]]; then
            echo "ERROR: Invalid Antigravity 2 URL format: ${url}"
            exit 1
          fi
          curl -fsSI "$url" >/dev/null

          # Verify failed download does not wipe existing installation
          tmp_home="$(mktemp -d)"
          mkdir -p "${tmp_home}/.local/share/antigravity2"
          touch "${tmp_home}/.local/share/antigravity2/sentinel"
          if HOME="$tmp_home" ANTIGRAVITY2_URL="invalid://bad.tar.gz" antigravity2_install; then
            echo "ERROR: antigravity2_install should have failed on unreachable URL"
            exit 1
          fi
          if [ ! -f "${tmp_home}/.local/share/antigravity2/sentinel" ]; then
            echo "ERROR: Existing installation was wiped after failed download"
            exit 1
          fi
          rm -rf "$tmp_home"

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
